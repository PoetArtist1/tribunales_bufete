# Sistema de transferencia segura de archivos jurídicos
# Emisor (Bufete) + Receptor (Tribunales) + PostgreSQL

services:
  postgres:
    image: postgres:16-alpine
    container_name: juridico-postgres
    environment:
      POSTGRES_DB: juridico_receptor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  receptor-backend:
    build: ./receptor/backend
    container_name: juridico-receptor-backend
    environment:
      PORT_FRONT: 4000
      PORT_BACK: 4001
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: juridico_receptor
      PG_USER: postgres
      PG_PASSWORD: postgres
    volumes:
      - receptor_keys:/app/keys
    ports:
      - '4001:4001'
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy

  receptor-frontend:
    build:
      context: .
      dockerfile: receptor/frontend/Dockerfile
    container_name: juridico-receptor-frontend
    environment:
      PORT: 4000
      VITE_API_BASE: http://localhost:4001
    ports:
      - '4000:4000'
    networks:
      - frontend
    depends_on:
      - receptor-backend

  emisor-backend:
    build: ./emisor/backend
    container_name: juridico-emisor-backend
    environment:
      PORT_FRONT: 3000
      PORT_BACK: 3001
      RECEPTOR_URL: http://receptor-backend:4001
    ports:
      - '3001:3001'
    networks:
      - frontend
    depends_on:
      - receptor-backend

  emisor-frontend:
    build:
      context: .
      dockerfile: emisor/frontend/Dockerfile
    container_name: juridico-emisor-frontend
    environment:
      PORT: 3000
      VITE_EMISOR_API_BASE: http://localhost:3001
    ports:
      - '3000:3000'
    networks:
      - frontend
    depends_on:
      - emisor-backend

volumes:
  postgres_data:
  receptor_keys:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
