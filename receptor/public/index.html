<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receptor — Documentos Jurídicos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Sistema Receptor de Documentos Jurídicos</h1>
      <p class="subtitle">Tribunales — Consulta de documentos</p>
    </header>
    <main class="main">
      <input type="text" id="buscador" placeholder="Buscar..." />
      <section class="section">
        <h2>Documentos recibidos</h2>
        <div id="lista-documentos" class="lista-documentos">
          <p id="mensaje-lista" class="mensaje">Cargando...</p>
        </div>
      </section>
    </main>
    <footer class="footer">
      <p>Transferencia segura</p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
